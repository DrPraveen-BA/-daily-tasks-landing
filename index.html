<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tasks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px 64px;
      color: #e0e7ff;
    }

    .app {
      width: 100%;
      max-width: 680px;
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 60%, #14172b 100%);
      border-radius: 16px;
      border: 1px solid rgba(99,102,241,0.3);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(99,102,241,0.1);
    }

    /* ── Header ── */
    .header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid rgba(99,102,241,0.2);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .date-block .day-name {
      font-size: 12px;
      color: #818cf8;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .date-block .full-date {
      font-size: 22px;
      color: #e0e7ff;
      font-weight: 700;
      margin-top: 2px;
    }
    .progress-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      padding-top: 4px;
    }
    .progress-label {
      font-size: 11px;
      color: #34d399;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .progress-bar-wrap {
      width: 120px;
      height: 6px;
      background: rgba(99,102,241,0.2);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #34d399);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* ── Add task bar ── */
    .add-bar {
      padding: 14px 28px;
      border-bottom: 1px solid rgba(99,102,241,0.15);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .add-bar input[type="text"],
    .add-bar select {
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 8px;
      padding: 8px 12px;
      color: #c7d2fe;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .add-bar input[type="text"]::placeholder { color: #4338ca; }
    .add-bar input[type="text"]:focus,
    .add-bar select:focus {
      border-color: rgba(99,102,241,0.6);
    }
    #title-input { flex: 1; min-width: 140px; }
    #category-input { width: 110px; }
    #priority-select { width: 100px; }
    #type-select { width: 110px; }
    .add-bar select option { background: #1e1b4b; }
    .add-btn {
      background: #6366f1;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .add-btn:hover { background: #4f46e5; }
    .add-btn:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }

    /* ── Priority sections ── */
    .sections { padding: 8px 0; }
    .priority-section { padding: 12px 28px; }
    .priority-section + .priority-section {
      border-top: 1px solid rgba(99,102,241,0.12);
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .section-label.high  { color: #f87171; }
    .section-label.medium { color: #fbbf24; }
    .section-label.low   { color: #818cf8; }
    .section-count {
      font-size: 10px;
      color: #4338ca;
      background: rgba(99,102,241,0.15);
      padding: 1px 8px;
      border-radius: 99px;
    }

    /* ── Task items ── */
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.15);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      transition: background 0.15s;
      position: relative;
    }
    .task-item:last-child { margin-bottom: 0; }
    .task-item:hover { background: rgba(99,102,241,0.13); }
    .task-item.done { opacity: 0.5; }

    .task-checkbox {
      width: 16px;
      height: 16px;
      border: 1.5px solid #4338ca;
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .task-checkbox.checked {
      background: #34d399;
      border-color: #34d399;
    }
    .task-checkbox.checked::after {
      content: '';
      display: block;
      width: 8px;
      height: 5px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translateY(-1px);
    }

    .task-title {
      font-size: 13px;
      color: #c7d2fe;
      flex: 1;
    }
    .task-item.done .task-title {
      text-decoration: line-through;
      color: #4338ca;
    }

    .category-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(99,102,241,0.2);
      color: #818cf8;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .recurring-badge {
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(52,211,153,0.1);
      color: #34d399;
      border: 1px solid rgba(52,211,153,0.25);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #4338ca;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .task-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #f87171; }
    @media (hover: none) {
      .delete-btn { opacity: 0.5; }
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 40px 28px;
      color: #818cf8;
      font-size: 13px;
    }

    /* ── Footer ── */
    .footer {
      padding: 12px 28px;
      border-top: 1px solid rgba(99,102,241,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .footer-hint {
      font-size: 11px;
      color: #4f46e5;
    }
    .clear-btn {
      font-size: 11px;
      color: #4338ca;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      transition: color 0.15s;
    }
    .clear-btn:hover { color: #818cf8; }
    .clear-btn:focus-visible { outline: 2px solid #818cf8; outline-offset: 2px; }

    /* ── Accessibility ── */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="date-block">
        <div class="day-name" id="day-name"></div>
        <div class="full-date" id="full-date"></div>
      </div>
      <div class="progress-block">
        <div class="progress-label" id="progress-label">0 of 0 done</div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progress-bar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Add task bar -->
    <div class="add-bar">
      <label for="title-input" class="sr-only">Task title</label>
      <input type="text" id="title-input" placeholder="Add a task..." autocomplete="off">
      <label for="category-input" class="sr-only">Category</label>
      <input type="text" id="category-input" placeholder="Category" list="category-list" autocomplete="off">
      <datalist id="category-list"></datalist>
      <label for="priority-select" class="sr-only">Priority</label>
      <select id="priority-select">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
      <label for="type-select" class="sr-only">Task type</label>
      <select id="type-select">
        <option value="one-off" selected>One-off</option>
        <option value="recurring">Recurring</option>
      </select>
      <button class="add-btn" id="add-btn">+ Add</button>
    </div>

    <!-- Priority sections injected here by JS -->
    <div class="sections" id="sections"></div>

    <!-- Footer -->
    <div class="footer">
      <span class="footer-hint">Recurring tasks reset at midnight &middot; One-off tasks carry over</span>
      <button class="clear-btn" id="clear-btn">Clear completed</button>
    </div>
  </div>

  <script>
    // ── State & Storage ──────────────────────────────────────────────────────────

    const STORAGE_KEY = 'daily-tasks';

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function loadTasks() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveTasks(tasks) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (e) {
        console.warn('daily-tasks: could not save to localStorage', e);
      }
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    // ── Daily Reset ───────────────────────────────────────────────────────────────

    function applyDailyReset(tasks) {
      const today = todayStr();
      return tasks.map(task => {
        if (task.type === 'recurring' && task.completedOn !== today) {
          return { ...task, completedOn: null };
        }
        return task;
      });
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────────────

    let tasks = applyDailyReset(loadTasks());
    saveTasks(tasks); // persist reset immediately

    // ── Render ────────────────────────────────────────────────────────────────────

    const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];

    const PRIORITY_CONFIG = [
      { key: 'high',   label: '⬆ High Priority',   cls: 'high'   },
      { key: 'medium', label: '→ Medium Priority',  cls: 'medium' },
      { key: 'low',    label: '↓ Low Priority',     cls: 'low'    },
    ];

    function renderTask(task) {
      const today = todayStr();
      const isDone = task.completedOn === today;
      const el = document.createElement('div');
      el.className = `task-item${isDone ? ' done' : ''}`;
      el.dataset.id = task.id;

      const checkbox = document.createElement('div');
      checkbox.className = `task-checkbox${isDone ? ' checked' : ''}`;
      checkbox.addEventListener('click', () => toggleTask(task.id));

      const title = document.createElement('span');
      title.className = 'task-title';
      title.textContent = task.title;

      const catBadge = document.createElement('span');
      catBadge.className = 'category-badge';
      catBadge.textContent = task.category;

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '×';
      delBtn.title = 'Delete task';
      delBtn.addEventListener('click', () => deleteTask(task.id));

      el.appendChild(checkbox);
      el.appendChild(title);
      el.appendChild(catBadge);

      if (task.type === 'recurring') {
        const recBadge = document.createElement('span');
        recBadge.className = 'recurring-badge';
        recBadge.textContent = '↺ daily';
        el.appendChild(recBadge);
      }

      el.appendChild(delBtn);
      return el;
    }

    function renderSections() {
      const container = document.getElementById('sections');
      container.innerHTML = '';

      if (tasks.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No tasks yet — add one above';
        container.appendChild(empty);
        return;
      }

      const today = todayStr();

      PRIORITY_CONFIG.forEach(({ key, label, cls }) => {
        const group = tasks.filter(t => t.priority === key);
        if (group.length === 0) return;

        const section = document.createElement('div');
        section.className = 'priority-section';

        const remaining = group.filter(t => t.completedOn !== today).length;

        const header = document.createElement('div');
        header.className = 'section-header';
        header.innerHTML = `
          <span class="section-label ${cls}">${label}</span>
          <span class="section-count">${remaining} remaining</span>
        `;
        section.appendChild(header);

        // Done tasks go to bottom of their section
        const sorted = [
          ...group.filter(t => t.completedOn !== today),
          ...group.filter(t => t.completedOn === today),
        ];
        sorted.forEach(t => section.appendChild(renderTask(t)));
        container.appendChild(section);
      });
    }

    function renderHeader() {
      const now = new Date();
      document.getElementById('day-name').textContent = DAYS[now.getDay()];
      document.getElementById('full-date').textContent =
        `${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

      const today = todayStr();
      const total = tasks.length;
      const done = tasks.filter(t => t.completedOn === today).length;

      document.getElementById('progress-label').textContent =
        `${done} of ${total} done`;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    function render() {
      renderHeader();
      renderSections();
    }

    // Initial render
    render();

    // ── Actions ───────────────────────────────────────────────────────────────────

    function updateCategoryDatalist() {
      const defaults = ['Work', 'Personal', 'Health'];
      const used = tasks.map(t => t.category).filter(Boolean);
      const all = [...new Set([...defaults, ...used])];
      const list = document.getElementById('category-list');
      list.innerHTML = '';
      all.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        list.appendChild(opt);
      });
    }

    function toggleTask(id) {
      const today = todayStr();
      tasks = tasks.map(task => {
        if (task.id !== id) return task;
        return {
          ...task,
          completedOn: task.completedOn === today ? null : today,
        };
      });
      saveTasks(tasks);
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks(tasks);
      render();
      updateCategoryDatalist();
    }

    function clearCompleted() {
      const today = todayStr();
      // Remove completed one-off tasks; leave recurring (they reset tomorrow)
      tasks = tasks.filter(task => {
        if (task.type === 'one-off' && task.completedOn === today) return false;
        return true;
      });
      saveTasks(tasks);
      render();
      updateCategoryDatalist();
    }

    document.getElementById('clear-btn').addEventListener('click', clearCompleted);

    function addTask() {
      const titleInput = document.getElementById('title-input');
      const title = titleInput.value.trim();
      if (!title) {
        titleInput.focus();
        return;
      }
      const category = document.getElementById('category-input').value.trim() || 'General';
      const priority = document.getElementById('priority-select').value;
      const type     = document.getElementById('type-select').value;

      const task = {
        id: generateId(),
        title,
        priority,
        category,
        type,
        completedOn: null,
      };

      tasks = [...tasks, task];
      saveTasks(tasks);
      titleInput.value = '';
      render();
      updateCategoryDatalist();
    }

    document.getElementById('add-btn').addEventListener('click', addTask);
    document.getElementById('title-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    // Populate datalist on load
    updateCategoryDatalist();
  </script>
</body>
</html>
